components:
  schemas:
    CommonResponseVoid:
      type: object
      properties:
        data:
          type: object
          description: Данные ответа
        status:
          type: string
          description: Статус ответа
          example: SUCCESS
          enum:
          - SUCCESS
          - ERROR
        problemDetail:
          $ref: "#/components/schemas/ProblemDetail"
        timestamp:
          type: string
          description: Время ответа
          format: date-time
      description: Общий формат ответа API
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
      description: Детали ошибки (только при ERROR)
    CommonResponseUserDetailsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/UserDetailsResponse"
        status:
          type: string
          description: Статус ответа
          example: SUCCESS
          enum:
          - SUCCESS
          - ERROR
        problemDetail:
          $ref: "#/components/schemas/ProblemDetail"
        timestamp:
          type: string
          description: Время ответа
          format: date-time
      description: Общий формат ответа API
    UserDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID пользователя
          format: int64
          example: 1
        username:
          type: string
          description: Имя пользователя
          example: Sara
        role:
          type: string
          description: Роль пользователя
          example: ROLE_USER
          enum:
          - ADMIN
          - USER
        status:
          type: string
          description: Статус аккаунта
          example: ACTIVE
          enum:
          - ACTIVE
          - BLOCKED
        uploadStatus:
          type: string
          description: Статус загрузки файлов
          example: NOT_UPLOADED
          enum:
          - UNLIMITED
          - NOT_UPLOADED
          - FILE_UPLOADED
      description: Информация о пользователе
    CommonResponseString:
      type: object
      properties:
        data:
          type: string
          description: Данные ответа
        status:
          type: string
          description: Статус ответа
          example: SUCCESS
          enum:
          - SUCCESS
          - ERROR
        problemDetail:
          $ref: "#/components/schemas/ProblemDetail"
        timestamp:
