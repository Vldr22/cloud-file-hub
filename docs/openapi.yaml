openapi: 3.0.1
info:
  title: CloudFileHub API
  description: |-
    Файловый хостинг с S3 хранилищем, JWT-аутентификацией и антивирусным сканированием.

    ---

    **Аутентификация**
    * Публичный доступ — просмотр списка файлов и скачивание без регистрации
    * Вход через `POST /api/auth/login` — JWT токен устанавливается в HttpOnly cookie
    * Все остальные защищённые endpoints требуют валидный JWT токен в cookie

    ---

    **Уровни доступа**
    * `ROLE_USER` — загрузка 1 файла, удаление только своих файлов
    * `ROLE_ADMIN` — загрузка до 5 файлов, удаление любых файлов, управление пользователями, просмотр аудит-логов и статистики
    * Публичный доступ — просмотр и скачивание файлов без регистрации

    ---

    **Формат ответов**

    Все endpoints возвращают `CommonResponse<T>`:
    ```json
    {
      "data": {},
      "status": "SUCCESS",
      "timestamp": "2026-03-11T03:41:17.639342344"
    }
    ```

    Ответ с ошибкой:
    ```json
    {
      "status": "ERROR",
      "problemDetail": {
        "type": "about:blank",
        "title": "Not Found",
        "status": 404,
        "detail": "File not found"
      },
      "timestamp": "2026-03-11T03:41:17.639342344"
    }
    ```

    ---
    **Ошибки**
    * `400` — ошибка валидации или неверный тип параметра
    * `401` — токен отсутствует или истёк
    * `403` — недостаточно прав или лимит загрузки исчерпан
    * `404` — файл или пользователь не найден
    * `409` — конфликт (username уже занят, файл дублируется)
    * `413` — файл превышает максимальный размер (30MB)
    * `500` — ошибка S3 или внутренняя ошибка сервера
  contact:
    name: Vladimir — GitHub
    url: https://github.com/Vldr22/cloud-file-hub
  version: "1.0"
servers:
- url: https://cloudfilehub.duckdns.org
  description: Production (VPS)
security:
- Bearer Authentication: []
tags:
- name: Home
  description: Публичный доступ к списку файлов без аутентификации
- name: Admin
  description: "Администрирование пользователями, файлами и логами"
- name: Admin
  description: "Управление пользователями, файлами и аудит-логами — только для адм\
    инистратора"
- name: Home
  description: Домашняя страница. Публичный доступ к списку файлов
- name: Auth
  description: "Регистрация, вход и выход из системы"
- name: Files
  description: "Загрузка, скачивание и удаление файлов"
paths:
  /api/admin/users/{userId}/status:
    put:
      tags:
      - Admin
      summary: Изменить статус пользователя
      description: Меняет статус (ACTIVE/BLOCKED). При блокировке инвалидирует токен
      operationId: changeUserStatus
      parameters:
      - name: userId
        in: path
        description: ID пользователя
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: status
        in: query
        description: Новый статус
        required: true
        schema:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
        example: BLOCKED
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "413":
          description: Payload Too Large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "401":
          description: Токен отсутствует или истёк
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "200":
          description: Статус изменён
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseUserDetailsResponse"
  /api/admin/users/{userId}/file-upload-status:
    put:
