      tags:
      - Admin
      summary: Повторить сканирование файла
      description: Отправляет файл на повторное сканирование. Только для статуса ERROR
      operationId: retryScan
      parameters:
      - name: fileId
        in: path
        description: ID файла
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Файл не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
