                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Файл не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "500":
          description: Ошибка S3
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "413":
          description: Payload Too Large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "200":
          description: Файл успешно скачан
          content:
            '*/*':
              schema:
                type: string
                format: binary
      security: []
    delete:
      tags:
      - Files
      summary: Удалить файл
      description: "Удаляет файл по уникальному имени. Пользователи — только свои\
        , админы — любые"
      operationId: delete
      parameters:
      - name: uniqueName
        in: path
        description: Уникальное имя файла
        required: true
        schema:
          type: string
        example: 212d7ce9-8451-4c4d-881e-d198593aa518.png
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Нет прав на удаление чужого файла
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Файл не найден
