      - Admin
      summary: Изменить статус загрузки
      description: Меняет лимит загрузки файлов (UNLIMITED/NOT_UPLOADED/FILE_UPLOADED)
      operationId: changeUserFileUploadStatus
      parameters:
      - name: userId
        in: path
        description: ID пользователя
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: uploadStatus
        in: query
        description: Новый статус загрузки
        required: true
        schema:
          type: string
          enum:
          - UNLIMITED
          - NOT_UPLOADED
          - FILE_UPLOADED
        example: UNLIMITED
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Пользователь не найден
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "413":
          description: Payload Too Large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "401":
          description: Токен отсутствует или истёк
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "200":
          description: Статус изменён
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseUserDetailsResponse"
  /api/files/upload:
    post:
      tags:
      - Files
      summary: Загрузить файл
      description: "Загружает один файл. Обычные пользователи — только 1 файл, адм\
        ины — без ограничений"
      operationId: upload
      requestBody:
        content:
          application/json:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: Файл для загрузки
                  format: binary
      responses:
        "409":
          description: Файл уже существует
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Лимит загрузки исчерпан или пользователь заблокирован
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
          description: Неверный тип или формат файла
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "413":
          description: Файл превышает 30MB
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "401":
          description: Токен отсутствует или истёк
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "201":
          description: Файл загружен
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseString"
  /api/files/multiple-upload:
    post:
      tags:
      - Files
      summary: Множественная загрузка
      description: Загружает до 5 файлов. Только для администраторов
      operationId: multipleUpload
      parameters:
      - name: files
        in: query
        description: Файлы для загрузки (до 5)
        required: true
        schema:
          type: array
          items:
            type: string
            format: binary
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Недостаточно прав
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "400":
