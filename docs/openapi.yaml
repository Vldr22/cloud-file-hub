  /api/files/{uniqueName}:
    get:
      tags:
      - Files
      summary: Скачать файл
      description: Скачивает файл по уникальному имени
      operationId: download
      parameters:
      - name: uniqueName
        in: path
        description: Уникальное имя файла
        required: true
        schema:
          type: string
        example: 212d7ce9-8451-4c4d-881e-d198593aa518.png
      responses:
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonResponseVoid"
        "403":
          description: Forbidden
          content:
            '*/*':
