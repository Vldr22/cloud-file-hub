          - SUCCESS
          - ERROR
        originalFileName:
          type: string
          description: Оригинальное имя файла
          example: photo.png
        uniqueName:
          type: string
          description: Уникальное имя файла в хранилище
          example: 212d7ce9-8451-4c4d-881e-d198593aa518.png
